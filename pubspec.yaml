name: reachbell
description: Flutter client SDK for ReachBell push notifications. Registers the device FCM token on Android and iOS, then identifies and tags the subscriber.
version: 1.0.0
homepage: https://reachbell.com
repository: https://github.com/reachbell/reachbell-flutter
issue_tracker: https://github.com/reachbell/reachbell-flutter/issues
documentation: https://docs.reachbell.com/mobile/flutter
topics:
  - push-notifications
  - notifications
  - fcm
  - firebase
  - messaging

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

platforms:
  android:
  ios:

dependencies:
  flutter:
    sdk: flutter
  firebase_messaging: ">=15.0.0 <18.0.0"
  http: ^1.2.0
  meta: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"
